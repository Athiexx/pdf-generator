<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="./images/icons8-favicon-50.png">
    <script type="module" src="index.js">
    </script>
    <title>Human Resources Website</title>
</head>

<body>
    <div id="dsnyLogo-container" class="dsnyLogo">
        <img src="./images/New_York_City_Department_of_Sanitation_logo.svg"
            alt="New York City Department of Sanitation Logo">
    </div>

    <h1>Welcome to the Human Resources Website!</h1>
    <p>This website is for the DS-46 form.</p>

    <div id="form-container">
        <form>
            <fieldset id="personnel-action-section">
                <legend><u>Request for Personnel Action DS 46</u></legend>
                <div id="textbox-field-personnel-action">

                        <div>
                            <label for="bureau">Bureau</label>
                            <input type="text" id="bureau" name="bureau">
                        </div>
                        <div>
                            <label for="division">Division</label>
                            <input type="text" id="division" name="division">
                        </div>
                        <div>
                            <label for="pay-location">Pay Location</label>
                            <input type="text" id="pay-location" name="pay-location">
                        </div>
                        <div>
                            <label for="control-number">Control Number</label>
                            <input type="text" id="control-number" name="control-number">
                        </div>
                        <div>
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" name="firstname">
                        </div>
                        <div>
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="lastname">
                        </div>
                        <div>
                            <label for="reference-number">Reference Number</label>
                            <input type="text" id="reference-number" name="reference-number">
                        </div>
                        <div>
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address">
                        </div>
                        <div>
                            <label for="present-title-level">Present Title/Level</label>
                            <input type="text" id="present-title-level" name="present-title-level">
                        </div>
                        <div>
                            <label for="title-code-number">Title Code Number</label>
                            <input type="text" id="title-code-number" name="title-code-number">
                        </div>
                </div>

                <div id="checkbox-field-personnel-action">
                        <legend><u>Present Status</u></legend>
                        <div>
                            <input type="radio" id="civil-service-present-status" name="checkbox-personnel-action">
                            <label for="civil-service-present-status">Civil Service</label>
                        </div>
                        <div>
                            <input type="radio" id="provisional-present-status" name="checkbox-personnel-action">
                            <label for="provisional-present-status">Provisional</label>
                        </div>
                        <div>
                            <input type="radio" id="non-comp-present-status" name="checkbox-personnel-action">
                            <label for="non-comp-present-status">Non-Competitive</label>
                        </div>
                        <div>
                            <input type="radio" id="other-present-status" name="checkbox-personnel-action">
                            <label for="other-present-status">Other</label>
                        </div>

                </div>
            </fieldset>
            <fieldset id="type-of-action-requested-section">
                <legend><u>Type of Action Requested</u></legend>
                <div id="textbox-field-type-of-action-requested">
                    <div id="newappointment-promotion-other">
                        <legend><u>New Appointment, Promotion, or Other</u></legend>
                        <div>
                            <label for="title-level">Title/Level</label>
                            <input type="text" id="title-level" name="title-level">
                        </div>
                        <div>
                            <label for="title-code-number">Title Code Number</label>
                            <input type="text" id="title-code-number" name="title-code-number">
                        </div>
                        <div>
                            <label for="salary-requested">Salary Requested</label>
                            <input type="text" id="salary-requested" name="salary-requested">
                        </div>
                        <div>
                            <label for="amount-of-increase">Amount of Increase</label>
                            <input type="text" id="amount-of-increase" name="amount-of-increase">
                        </div>
                        <div>
                            <label for="percent-of-increase">Percent of Increase</label>
                            <input type="text" id="percent-of-increase" name="percent-of-increase">
                        </div>
                        <div>
                            <label for="new-salary">New Salary</label>
                            <input type="text" id="new-salary" name="new-salary">
                        </div>
                    </div>
                    <div id="merit-increase">
                        <legend><u>Merit Increase</u></legend>
                        <div>
                            <label for="amount-of-increase-merit">Amount of Increase</label>
                            <input type="text" id="amount-of-increase-merit" name="amount-of-increase-merit">
                        </div>
                        <div>
                            <label for="percent-of-increase-merit">Percent of Increase</label>
                            <input type="text" id="percent-of-increase-merit" name="percent-of-increase-merit">
                        </div>
                        <div>
                            <label for="new-salary-merit">New Salary</label>
                            <input type="text" id="new-salary-merit" name="new-salary-merit">
                        </div>
                    </div>
                    <div id="separation">
                        <legend><u>Separation</u></legend>
                        <div>
                            <label for="reason-for-separation">Reason for Separation</label>
                            <input type="text" id="reason-for-separation" name="reason-for-separation">
                        </div>
                        <div>
                            <label for="last-day-of-work">Last Day Worked</label>
                            <input type="text" id="last-day-of-work" name="last-day-of-work">
                        </div>
                        <div>
                            <label for="separation-date">Separation Date</label>
                            <input type="date" id="separation-date" name="separation-date">
                        </div>
                    </div>
                    <div id="leave-without-pay">
                        <legend><u>Leave Without Pay</u></legend>
                        <div>
                            <label for="reason">Reason</label>
                            <input type="text" id="reason" name="reason">
                        </div>
                        <div>
                            <label for="from">From</label>
                            <input type="date" id="from" name="from">
                        </div>
                        <div>
                            <label for="to">To</label>
                            <input type="date" id="to" name="to">
                        </div>
                    </div>
                    <div id="justification-and/or-remarks">
                        <legend><u>Justification and/or Remarks</u></legend>
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name">
                        </div>
                        <div>
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title">
                        </div>
                        <div>
                            <label for="type-of-separation">Type of Separation</label>
                            <input type="text" id="type-of-separation" name="type-of-separation">
                        </div>
                        <div>
                            <label for="C.O.B.-date">C.O.B. Date</label>
                            <input type="date" id="C.O.B.-date" name="C.O.B.-date">
                        </div>
                        <div>
                            <label for="salary">Salary</label>
                            <input type="text" id="salary" name="salary">
                        </div>
                        <div>
                            <label for="other-remarks">Other Remarks</label>
                            <input type="text" id="other-remarks" name="other-remarks">
                        </div>
                    </div>
                </div>
                <div id="checkbox-field-type-of-action-requested">
                    <legend><u>Type of Action Requested</u></legend>
                    <div id="type-of-action-requested">
                        <div>
                            <input type="radio" id="new-appointment" name="type-of-action-requested">
                            <label for="new-appointment">New Appointment</label>
                        </div>
                        <div>
                            <input type="radio">
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>

    <div id="button-container">
        <button name="submit">Submit</button>
    </div>
</body>

</html>
